image: docker.uib.gmbh/opsi/dev/pybuilder:deb9

variables:
  CI_DEBUG_SERVICES: "false"

stages:
  - test
  - build
  - publish

test:lint-and-test:
  stage: test
  tags:
    - docker-x64
  except:
    variables:
      - $SKIP_TESTS
  image: docker
  before_script:
    - TXT_HEAD="\e[46m\e[1;37m" && TXT_ERROR="\e[1;31m" && TXT_CLEAR="\e[0m"
    # https://gitlab.com/gitlab-org/gitlab-foss/-/issues/41227
    - CONTAINER_ID=$(docker ps -q -f "label=com.gitlab.gitlab-runner.job.id=$CI_JOB_ID" -f "label=com.gitlab.gitlab-runner.type=build")
    - LOCAL_WORKSPACE_DIR=$(docker inspect $CONTAINER_ID -f "{{ range .Mounts }}{{ if eq .Destination \"/builds\" }}{{ .Source }}{{end}}{{end}}")/uib/opsiconfd/
    - DOCKER_COMPOSE="docker compose -f docker/opsiconfd-dev/docker-compose.yml -p opsiconfd-test-$CI_JOB_ID"

    - echo "LOCAL_WORKSPACE_DIR=${LOCAL_WORKSPACE_DIR}"
    - cp docker/opsiconfd-dev/common.env docker/opsiconfd-dev/.env
    - echo "UV_PYTHON_INSTALL_DIR=/workspace/.uv_python" >> docker/opsiconfd-dev/.env
    - echo "OPSILICSRV_TOKEN=${OPSILICSRV_TOKEN}" >> docker/opsiconfd-dev/.env
    - echo "LOCAL_WORKSPACE_DIR=${LOCAL_WORKSPACE_DIR}" >> docker/opsiconfd-dev/.env
    - echo "OPSISERVER_DEV_OPSICONFD_FORWARD_PORT=" >> docker/opsiconfd-dev/.env
    - echo "OPSISERVER_CS_OPSICONFD_FORWARD_PORT=" >> docker/opsiconfd-dev/.env
    - echo "DEV_USER=" >> docker/opsiconfd-dev/.env
    - echo "DEV_UID=" >> docker/opsiconfd-dev/.env
    - echo "BENCHER_HOST=${BENCHER_HOST}" >> docker/opsiconfd-dev/.env
    - echo "BENCHER_API_TOKEN=${BENCHER_API_TOKEN}" >> docker/opsiconfd-dev/.env

    - echo -e "${TXT_HEAD}Build docker images${TXT_CLEAR}"
    - $DOCKER_COMPOSE build --pull

    - rm -rf .venv

  after_script:
    - 'echo "CI_JOB_STATUS: $CI_JOB_STATUS"'
    - TXT_HEAD="\e[46m\e[1;37m" && TXT_ERROR="\e[1;31m" && TXT_CLEAR="\e[0m"
    - DOCKER_COMPOSE="docker compose -f docker/opsiconfd-dev/docker-compose.yml -p opsiconfd-test-$CI_JOB_ID"

    - '[ "$CI_DEBUG_SERVICES" = "true" ] && $DOCKER_COMPOSE logs'
    - $DOCKER_COMPOSE logs opsiserver43-dev > docker-opsiserver43-dev.log
    - $DOCKER_COMPOSE logs opsiserver43-cs > docker-opsiserver43-cs.log
    - echo -e "${TXT_HEAD}Stop docker containers${TXT_CLEAR}"
    - $DOCKER_COMPOSE down -v
  script:
    - 'echo "CI_CONCURRENT_ID: $CI_CONCURRENT_ID"'
    - echo -e "${TXT_HEAD}Fetch bencher${TXT_CLEAR}"
    - wget -q https://github.com/bencherdev/bencher/releases/download/v0.5.6/bencher-v0.5.6-linux-x86-64 -O bencher
    - chmod +x bencher

    - echo -e "${TXT_HEAD}Prepare docker containers${TXT_CLEAR}"
    - $DOCKER_COMPOSE up --detach --wait --wait-timeout 300

    - for i in 1 2 3 4 5 6 7 8 9; do sleep 1; $DOCKER_COMPOSE exec opsiserver43-dev ping -c1 opsiserver43-cs && break; done
    - |
      $DOCKER_COMPOSE exec opsiserver43-dev ping -c1 opsiserver43-cs || (
        echo -e "${TXT_ERROR}Could not ping opsiserver43-cs${TXT_CLEAR}"
        $DOCKER_COMPOSE ps -a
        exit 1
      )
    - echo -e "${TXT_HEAD}Run linters${TXT_CLEAR}"
    - $DOCKER_COMPOSE exec opsiserver43-dev uv run ruff check opsiconfd tests perftest
    - $DOCKER_COMPOSE exec opsiserver43-dev uv run ty check opsiconfd tests perftest

    - echo -e "${TXT_HEAD}Run pytest${TXT_CLEAR}"
    - $DOCKER_COMPOSE exec opsiserver43-dev uv run pytest -x --tb=short -o junit_family=xunit2 --junitxml=testreport.xml --cov-append --cov opsiconfd --cov-report term --cov-report xml -v tests

    - echo -e "${TXT_HEAD}Run perftests${TXT_CLEAR}"
    - $DOCKER_COMPOSE exec opsiserver43-dev uv run opsiconfd -c tests/data/default-opsiconfd.conf --workers=1 --log-level-file=5 --log-file=opsiconfd-perftest.log --max-session-per-ip=20000 &
    - sleep 15

    - echo -e "${TXT_HEAD}Run opsiconfd-perftest${TXT_CLEAR}"
    # Average request time has to be faster than 10 ms
    - |
      $DOCKER_COMPOSE exec opsiserver43-dev uv run ./perftest/opsiconfd-perftest.py -l perftest/tests/test_session_loading.json --max-errors 0 --max-avg-seconds-per-request 0.01 --bencher-results bencher-results.json || (
        echo -e "${TXT_ERROR}opsiconfd-perftest.py failed${TXT_CLEAR}"
        cat opsiconfd-perftest.log
        exit 1
      )

    - echo -e "${TXT_HEAD}Run opsiconfd-backend-perftest${TXT_CLEAR}"
    - |
      $DOCKER_COMPOSE exec opsiserver43-dev uv run ./perftest/opsiconfd-backend-perftest.py --products 100 --clients 100 --iterations 5 --max-real 30000 --bencher-results bencher-results.json --bencher-measure backend-perftest-rpc-duration || (
        echo -e "${TXT_ERROR}opsiconfd-backend-perftest.py failed${TXT_CLEAR}"
        cat opsiconfd-perftest.log
        exit 1
      )

    - echo -e "${TXT_HEAD}Run file-download memory test${TXT_CLEAR}"
    - |
      $DOCKER_COMPOSE exec opsiserver43-dev uv run python ./perftest/file-download.py --clients=5 --file-size=500 --min-download-time=20 --memory-usage-limit 20 || (
        echo -e "${TXT_ERROR}file-download.py failed${TXT_CLEAR}"
        cat opsiconfd-perftest.log
        exit 1
      )
    - |
      $DOCKER_COMPOSE exec opsiserver43-dev uv run python ./perftest/file-download.py --clients=10 --file-size=200 --min-download-time=20 --memory-usage-limit 20 --range-requests || (
        echo -e "${TXT_ERROR}file-download.py failed (range-requests)${TXT_CLEAR}"
        cat opsiconfd-perftest.log
        exit 1
      )

    - echo -e "${TXT_HEAD}Run messagebus websocket load test${TXT_CLEAR}"
    - |
      $DOCKER_COMPOSE exec opsiserver43-dev uv run ./perftest/messagebus-clients.py --clients 1000 --event-interval 30 --start-gap 20 || (
        echo -e "${TXT_ERROR}messagebus-clients.py failed${TXT_CLEAR}"
        cat opsiconfd-perftest.log
        exit 1
      )

    - echo -e "${TXT_HEAD}Run opsiconfd get-config duration test${TXT_CLEAR}"
    - |
      $DOCKER_COMPOSE exec opsiserver43-dev uv run ./perftest/bencher-command.py -r bencher-results.json -m opsiconfd-get-config-duration -x 1.0 -i 6 uv run opsiconfd get-config || (
        echo -e "${TXT_ERROR}bencher-command.py failed${TXT_CLEAR}"
        exit 1
      )

    - $DOCKER_COMPOSE exec opsiserver43-dev ./bencher run --project opsiconfd --if-branch "$CI_COMMIT_REF_NAME" --else-if-branch "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --else-if-branch main --err --adapter json --file bencher-results.json
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    when: always
    name: 'opsiconfd_test'
    paths:
      - coverage.xml
      - docker-opsiserver43-cs.log
      - docker-opsiserver43-dev.log
    expire_in: 3 days
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

build:linux-x64:
  stage: build
  image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11
  tags:
    - docker-x64
  script:
    - export UV_PYTHON_PREFERENCE="only-managed"
    - export UV_PYTHON="3.14"
    - TRANSIFEX_MIN_REVIEW_RATE=0.0
    - '[ "$CI_COMMIT_TAG" = "" ] || TRANSIFEX_MIN_REVIEW_RATE=1.0'
    - apt update
    - apt-get --yes install clang
    - opsi-dev-cli self upgrade
    - rm -rf .venv
    - uv self update
    - uv sync --frozen
    - uv run opsi-dev-cli -l debug pyinstaller build
    - mv opsiconfd opsiconfd.src
    - mv dist/opsiconfd ./opsiconfd-amd64
    # Check if binary is working
    - ./opsiconfd-amd64/opsiconfd -c opsiconfd_data/etc/opsiconfd.conf --python-info
    # Check for vulnerabilities
    - opsi-dev-cli appsec scan --max-severity-allowed none --ignore CVE-1999-0342,CVE-2005-2977 ./opsiconfd-amd64/sbom.cyclonedx.json
  artifacts:
    name: 'opsiconfd-linux-pyinstaller'
    paths:
      - opsiconfd-amd64
    expire_in: 2 day

build:linux-x64-debug:
  stage: build
  when: manual
  tags:
    - docker-x64
  script:
    - export UV_PYTHON_PREFERENCE="only-managed"
    - export UV_PYTHON="3.14"
    - TRANSIFEX_MIN_REVIEW_RATE=0.0
    - '[ "$CI_COMMIT_TAG" = "" ] || TRANSIFEX_MIN_REVIEW_RATE=1.0'
    - apt update
    - apt-get --yes install clang zstd libmariadb-dev libmariadb-dev-compat
    - opsi-dev-cli self upgrade
    - rm -rf .venv
    - uv self update
    - wget https://github.com/astral-sh/python-build-standalone/releases/download/20250702/cpython-3.13.5+20250702-x86_64-unknown-linux-gnu-debug-full.tar.zst -O- | zstd -d | tar -xf -
    - export CFLAGS='-g -O0'
    - export CXXFLAGS='-g -O0'
    - sed -i '/no-binary-package.*/d' pyproject.toml
    #- sed -i '/\[tool\.uv\]/a\no-binary-package = ["aiohttp","cffi","charset_normalizer","Crypto","frozenlist","greenlet","hiredis","lz4","lxml","markupsafe","multidict","msgpack","msgspec","mysqlclient","netifaces","psutil","sqlalchemy","uvloop","websockets","wrapt","xmlsec","yaml","yarl","zstandard"]\nno-cache = true' pyproject.toml
    - sed -i '/\[tool\.uv\]/a\no-binary-package = ["aiohttp","cffi","charset_normalizer","Crypto","frozenlist","hiredis","lz4","lxml","markupsafe","multidict","msgpack","msgspec","mysqlclient","netifaces","psutil","sqlalchemy","uvloop","websockets","wrapt","xmlsec","yaml","yarl","zstandard"]\nno-cache = true' pyproject.toml
    #- uv sync --python ./python/install --frozen
    #- uv run --python ./python/install opsi-dev-cli -l debug pyinstaller build --extra-args "--noupx"
    - uv sync --frozen
    - uv run opsi-dev-cli -l debug pyinstaller build --extra-args "--noupx"
    - install -m 0644 python/install/lib/libpython3.13d.so.1.0 dist/opsiconfd/_internal/libpython3.13.so.1.0
    - install -m 0644 python/install/lib/python3.13/_sysconfigdata_d_linux_x86_64-linux-gnu.py dist/opsiconfd/_internal/_sysconfigdata_d_linux_x86_64-linux-gnu.py
    - mv opsiconfd opsiconfd.src
    - mv dist/opsiconfd ./opsiconfd-amd64-debug
    # Check if binary is working
    - ./opsiconfd-amd64-debug/opsiconfd -c opsiconfd_data/etc/opsiconfd.conf --python-info
  artifacts:
    name: 'opsiconfd-linux-pyinstaller-debug'
    paths:
      - opsiconfd-amd64-debug
    expire_in: 2 day

build:linux-arm64:
  stage: build
  tags:
    - docker-arm64
  script:
    - export UV_PYTHON_PREFERENCE="only-managed"
    - export UV_PYTHON="3.14"
    - TRANSIFEX_MIN_REVIEW_RATE=0.0
    - '[ "$CI_COMMIT_TAG" = "" ] || TRANSIFEX_MIN_REVIEW_RATE=1.0'
    - opsi-dev-cli self upgrade
    - rm -rf .venv
    - uv self update
    - uv sync --frozen
    - uv run opsi-dev-cli -l debug pyinstaller build
    - mv opsiconfd opsiconfd.src
    - mv dist/opsiconfd ./opsiconfd-arm64
    # Check if binary is working
    - OPSI_HOSTNAME=test.uib.local ./opsiconfd-arm64/opsiconfd -c opsiconfd_data/etc/opsiconfd.conf --python-info
    # Check for vulnerabilities
    - opsi-dev-cli appsec scan --max-severity-allowed none --ignore CVE-1999-0342,CVE-2005-2977 ./opsiconfd-arm64/sbom.cyclonedx.json
  artifacts:
    name: 'opsiconfd-arm64-pyinstaller'
    paths:
      - opsiconfd-arm64
    expire_in: 2 day

publish:obs_ext:
  stage: publish
  tags:
    - docker-x64
  dependencies:
    - build:linux-x64
    - build:linux-arm64
  script:
    - opsi-dev-cli self upgrade --system
    - opsi-dev-cli -l info packaging obs update-package https://build.opensuse.org home:uibmz:opsi:4.3:development
    - opsi-dev-cli -l info changelog from-git output
    - opsi-dev-cli release-service register-package-version opsiconfd SERVER_PACKAGE --changelog-file output/changelog.md --sbom-file opsiconfd-amd64/sbom.cyclonedx.json
    - opsi-dev-cli release-service push-repository-state opsiconfd SERVER_PACKAGE SERVER_PACKAGE-4.3-development
  only:
    - tags
