# -*- coding: utf-8 -*-

module = 'Monitoring'
config = {
    # Enable the integration of a monitoring system (requires the module "monitoring")?
    "enabled":             False,
    # Type of the monitoring system. Supported: "checkmk"
    "type":                "checkmk",
    # Base url of the monitoring system.
    # For checkmk this has to include the site name, for example: "https://checkmk.example.org/mysite"
    "url":                 "",
    # Version of the REST API (checkmk: "1.0" up to Checkmk 2.4, "v1" since Checkmk 2.5)
    "apiVersion":          "1.0",
    # Credentials of the user used for the requests (checkmk: automation user and automation secret)
    "username":            "automation",
    "secret":              "",
    # Verify the TLS certificate of the monitoring system? True / False / "/path/to/ca-bundle.pem"
    "verifySsl":           True,
    # Request timeout in seconds
    "timeout":             10,
    # Maximum duration of a downtime in seconds
    "maxDowntimeDuration": 14400,
    # Downtimes created by opsi start with this prefix in their comment.
    # Only downtimes with this prefix are removed by opsi.
    "commentPrefix":       "[opsi]"
}
