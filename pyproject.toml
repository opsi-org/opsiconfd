[project]
name = "opsiconfd"
version = "4.3.31.29"
description = "opsi configuration service"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
	"acme>=3.0",
	"aiofiles>=24.1",
	"aiohttp>=3.7",
	"aiologger>=0.7",
	"aiozeroconf>=0.1",
	"annotated-types>=0.7",
	"click>=8.1",
	"configargparse>=1.4",
	"configupdater>=3.1",
	"distro>=1.5",
	"fastapi>=0.115",
	"greenlet>=3.0",
	"hiredis>=3.0",
	"httpx>=0.28",
	"itsdangerous>=2.0",
	"mysqlclient>=2.0,<2.2",
	"netifaces>=0.11",
	"objgraph>=3.5",
	"py3dns>=4.0",
	"pydantic>=2.4",
	"pydantic-core>=2.18",
	"pympler>=1.0",
	"pymysql>=1.1",
	"pyotp>=2.8",
	"python-magic>=0.4",
	"python-multipart>=0.0",
	"python-opsi>=4.3.6,<4.4",
	"python-opsi-common>=4.3.22,<4.4",
	"python-opsi-system>=4.3.2.1,<4.4",
	"python3-saml==1.16.0",
	"qrcode>=8.0",
	"redis>=5.0",
	"rich>=13.0",
	"six>=1.16",
	"starlette>=0.46",
	"uvicorn>=0.34",
	"uvloop>=0.21",
	"websockets>=15.0",
	"werkzeug>=3.0",
	"wsgidav>=4.3",
	"wsproto>=1.2",
	"xmlsec",
	"lxml",
	"yappi>=1.4; platform_machine == 'x86_64'",
]

[[project.authors]]
name = "uib GmbH"
email = "info@uib.de"

[[project.maintainers]]
name = "uib GmbH"
email = "info@uib.de"

[dependency-groups]
dev = [
	"bandit>=1.7",
	"dill>=0.3",
	"hypothesis>=6.32",
	"idna>=3.3",
	"lxml-stubs>=0.5",
	"mock>=5.0",
	"mypy>=1.4",
	"pydevd>=3.0",
	"pyinstaller>=6.12",
	"pyinstaller-hooks-contrib>=2025.1",
	"pytest>=8.0",
	"pytest-asyncio>=0.25",
	"pytest-cov>=6.0",
	"pytest-retry>=1.6",
	"pytest-subprocess>=1.5",
	"ruff>=0.9",
	"types-certifi>=2021.10",
	"types-ldap3>=2.9",
	"types-psutil>=7.0",
	"types-redis>=4.1",
	"types-requests>=2.27",
	"wrapt>=1.14",
]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://www.opsi.org"

[project.scripts]
opsiconfd = "opsiconfd.__main__:main"

[tool.uv]
extra-index-url = ["https://pypi.uib.gmbh/simple"]
index-strategy = "unsafe-best-match"
package = true

[tool.mypy]
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
follow_imports = "silent"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.uv.sources]
[[tool.uv.sources.xmlsec]]
path = "binary-wheels/xmlsec-1.3.15.dev19+g1104b4c-cp313-cp313-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
marker = "platform_machine == 'x86_64'"

[[tool.uv.sources.xmlsec]]
path = "binary-wheels/xmlsec-1.3.15.dev19+g1104b4c-cp313-cp313-manylinux_2_17_aarch64.manylinux2014_aarch64.whl"
marker = "platform_machine == 'aarch64'"

[[tool.uv.sources.lxml]]
path = "binary-wheels/lxml-5.3.0-cp313-cp313-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
marker = "platform_machine == 'x86_64'"

[[tool.uv.sources.lxml]]
path = "binary-wheels/lxml-5.3.0-cp313-cp313-manylinux_2_17_aarch64.manylinux2014_aarch64.whl"
marker = "platform_machine == 'aarch64'"

[tool.ruff.format]
indent-style = "tab"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
	"grafana_is_local: mark test to run only if a local grafana instance is running on the local host",
]
filterwarnings = ["ignore::urllib3.exceptions.InsecureRequestWarning"]

[tool.setuptools.package-data]
opsiconfd_data = ["*"]

[tool.setuptools.packages.find]
include = ["opsiconfd", "opsiconfd.*", "opsiconfd_data", "opsiconfd_data.*"]
