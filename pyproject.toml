[project]
name = "opsiconfd"
version = "4.3.56.11"
description = "OPSI configuration service"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.14"
dependencies = [
	"acme>=3.0",
	"aiofiles>=24.1",
	"aiohttp>=3.7",
	"aiologger>=0.7",
	"aiozeroconf>=0.1",
	"annotated-types>=0.7",
	"click>=8.1",
	"configargparse>=1.4",
	"configupdater>=3.1",
	"distro>=1.5",
	"fastapi>=0.141.1",
	"greenlet>=3.0",
	"hiredis>=3.1",
	"httpx>=0.28",
	"itsdangerous>=2.0",
	"mysqlclient>=2.0,<2.2",
	"netifaces>=0.11",
	"objgraph>=3.5",
	"py3dns>=4.0",
	"pydantic>=2.12.0a1",
	"pydantic-core>=2.18",
	"pympler>=1.0",
	"pymysql>=1.1",
	"pyotp>=2.8",
	"python-magic>=0.4",
	"python-multipart>=0.0",
	"python-opsi-legacy>=4.3.6,<4.4",
	"minisaml>=26.1",
	"qrcode>=8.0",
	"redis>=8.1",
	"rich>=13.0",
	"six>=1.16",
	"starlette>=0.46",
	"uvicorn>=0.34",
	"uvloop>=0.22",
	"websockets>=15.0",
	"werkzeug>=3.0",
	"wsgidav>=4.3.4",
	"wsproto>=1.2",
	"lxml",
	"yappi>=1.4; platform_machine == 'x86_64'",
	"lz4>=4.4.5",
	"pam>=0.2.0",
	"crypt-r>=3.13.1",
	"bcrypt>=4.0.0",
	"pydantic-extra-types>=2.10.6",
	"argon2-cffi>=25.1.0",
	"ldap3>=2.9.1",
	"python-opsi>=4.3.22",
]

[[project.authors]]
name = "uib GmbH"
email = "info@uib.de"

[[project.maintainers]]
name = "uib GmbH"
email = "info@uib.de"

[dependency-groups]
dev = [
	"bandit>=1.7",
	"dill>=0.3",
	"hypothesis>=6.32",
	"idna>=3.3",
	"lxml-stubs>=0.5",
	"mock>=5.0",
	"pydevd>=3.0",
	"pyinstaller>=6.12",
	"pyinstaller-hooks-contrib>=2025.1",
	"pytest>=8.0",
	"pytest-asyncio>=0.25",
	"pytest-cov>=6.0",
	"pytest-retry>=1.6",
	"pytest-subprocess>=1.5",
	"ruff>=0.9",
	"ty>=0.0.1a34",
	"types-aiofiles>=25.1.0.20251011",
	"types-certifi>=2021.10",
	"types-ldap3>=2.9",
	"types-psutil>=7.0",
	"types-redis>=4.1",
	"types-requests>=2.27",
	"wrapt>=1.14",
]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://www.opsi.org"

[project.scripts]
opsiconfd = "opsiconfd.__main__:main"

[tool.uv]
extra-index-url = ["https://pypi.uib.gmbh/simple"]
index-strategy = "unsafe-best-match"
package = true
no-binary-package = ["lxml"]

[tool.ruff]
line-length = 140
target-version = "py314"

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
ignore = [
	"BLE001",  # Public boundaries intentionally catch third-party and platform exceptions.
	"G201",    # Logging `.exception(...)` must not be used instead of `.error(..., exc_info=True)`
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI parameter defaults like Body(...) and Query(...) are the intended pattern (B008).
extend-immutable-calls = ["fastapi.Body", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
	"ASYNC230", # Test fixture I/O is intentionally synchronous.
	"TRY002",   # Tests intentionally exercise base exception handling.
	"S110",     # Best-effort cleanup and fallback paths intentionally suppress exceptions.
	"SIM117",   # Nested context managers keep setup and assertion scopes distinct.
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
	"grafana_is_local: mark test to run only if a local grafana instance is running on the local host",
]
filterwarnings = ["ignore::urllib3.exceptions.InsecureRequestWarning"]

[tool.setuptools.package-data]
opsiconfd_data = ["*"]

[tool.setuptools.packages.find]
include = ["opsiconfd", "opsiconfd.*", "opsiconfd_data", "opsiconfd_data.*"]
