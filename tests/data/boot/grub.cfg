echo "grub.cfg"

echo "client_id: {{ client.id if client else '' }}"
echo "depot_id: {{ depot.id }}"

{% if config_states["netboot.grub.graphicsmode"] %}
echo "gfxmode"
{% endif %}

{% if config_states["netboot.grub.password"] %}
echo "password: {{ config_states["netboot.grub.password"].password_hash('pbkdf2-sha512', 'grub') }}"
{% endif %}

{% if product %}
{{ product.grub_cfg() }}
{% else %}
set timeout={{ config_states["netboot.grub.timeout"] or "5" }}
menuentry 'Local Disk' {
	echo "Local Disk"
}
{% for entry in grub.menu_entries("netboot.grub.additional_menu_entries") %}
{{ entry }}
{% endfor %}
{% endif %}
